# Rebuilds manifest.json automatically whenever you add, rename or delete
# anything inside notes/ — even from the GitHub website or your phone.
name: Update notes index

on:
  push:
    paths:
      - "notes/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py
      - name: Commit manifest
        run: |
          git config user.name "notes-bot"
          git config user.email "notes-bot@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || (git commit -m "Update notes index" && git push)
